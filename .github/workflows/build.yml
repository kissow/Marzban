name: Mr.shaw fork image

on:
  push:
    branches:
      - master
    tags:
      - mrshaw-v*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check backend
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci --ignore-scripts
      - name: Check and build dashboard
        working-directory: app/dashboard
        env:
          VITE_BASE_API: /api/
        run: |
          npm run test:locales
          npm exec tsc -- --noEmit
          npm exec vite -- build --outDir build --assetsDir statics
          cp build/index.html build/404.html
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify formal Xray core pin
        run: |
          test "$(grep -m1 '^ARG XRAY_CORE_VERSION=' Dockerfile | cut -d= -f2 | tr -d '\r')" = "v26.3.27"
          test "$(grep -m1 'XRAY_CORE_VERSION=v26.3.27' .github/workflows/build.yml)" != ""
          ! grep -n -E 'XRAY_CORE_VERSION=v(25|26\.9\.9)' Dockerfile
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kissow/marzban
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha
            type=ref,event=tag
      - name: Build and publish fork image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            XRAY_CORE_VERSION=v26.3.27
